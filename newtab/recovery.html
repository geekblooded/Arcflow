<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page unavailable</title>
    <link rel="stylesheet" href="newtab.css" />
    <link rel="stylesheet" href="../styles/dia-frame.css" />
  </head>
  <body>
    <main class="new-tab">
      <section id="recoveryMessage" class="recovery">
        <h1>This page couldn’t be reached</h1>
        <p id="recoveryReason">Check the address or try again.</p>
      </section>
      <form id="ntAddressForm" class="address-form">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7.5"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
        <input id="ntAddressInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL" aria-label="Search or enter a URL" />
        <kbd>↵</kbd>
      </form>
      <button id="recoveryRetry" class="recovery-retry" type="button" hidden>Retry</button>
    </main>
    <script src="../content/fullscreen-frame.js"></script>
    <script src="../content/command-palette.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
